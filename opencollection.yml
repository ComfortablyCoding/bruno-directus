opencollection: 1.0.0

info:
  name: directus
  summary: "Comprehensive collection covering the Directus API: REST, GraphQL, and WebSockets."
  version: 1.0.0
bundled: false

docs:
  content: |-
    # Directus API

    A comprehensive collection for the [Directus](https://directus.com) API, covering the REST
    API, GraphQL, and the real-time WebSocket API. Requests are aligned to **Directus v12.x**.

    ## Getting started

    1. Pick an environment from the dropdown (top right): `local` or `production`.
    2. Set `base_url` to your Directus URL. The WebSocket requests use it too — Bruno connects
       to an `http://`/`https://` URL over `ws://`/`wss://`.
    3. Run **rest → auth → login_user** with valid credentials.

    Everything else is then authenticated automatically.

    ## Authentication

    The collection uses Bearer auth with `{{access_token}}`, and every request that needs a
    token inherits it. Requests that are public by design — login, refresh, logout, password
    reset, registration, share access — set no auth, so an expired token can't make them fail.

    Logging in (REST `login_user` / `login_with_provider`, or GraphQL `auth_login`) stores the
    returned `access_token` and `refresh_token` as **runtime variables**. They last for the
    session, are never written to disk, and take precedence over the environment's own
    `access_token`. They are tied to the `base_url` they were issued for: switch to an
    environment with a different `base_url` and they are dropped, so a token is never sent to a
    server that didn't issue it. `logout_user` clears them.

    To use a static token instead, set `access_token` in the environment and skip the login
    step. To test as another user, set that request's auth to `bearer` with their token; to
    test as the public, set it to no auth.

    ## Structure

    - **rest/** — the REST API, one folder per resource. Most resources expose
      query / query-by-id / create / update / delete plus bulk variants.
    - **graphql/** — queries, mutations, auth, and introspection (user data via `/graphql`,
      system data via `/graphql/system`).
    - **websockets/** — the real-time API: subscriptions, item actions, GraphQL subscriptions,
      and the logs stream.

    Many requests carry extra query parameters that are **disabled by default** — enable them to
    shape the response. The set is endpoint-specific: list endpoints accept the query system
    (`fields`, `filter`, `sort`, `limit`, `offset`, `search`, `meta`; `query_items` also shows
    `deep`, `aggregate`, `groupBy`, `alias`, `page`, `backlink`, and `export`), while
    single-item reads only accept what the API actually honors. Every list endpoint also
    accepts the `SEARCH` method with the query in the body — see **rest → items →
    search_items**.

    ## Links

    - [Directus API reference](https://directus.com/docs/api)
    - Directus serves its own OpenAPI spec at `/server/specs/oas` — see
      **rest → server → get_oas_spec**
  type: text/markdown

request:
  auth:
    type: bearer
    token: "{{access_token}}"
  scripts:
    - type: before-request
      code: |-
        // Captured tokens are bound to the base_url that issued them. If it has changed
        // (another environment, or an edited URL), drop them so {{access_token}} falls back
        // to the active environment's own value.
        const issuer = bru.getVar('token_base_url');
        if (issuer !== undefined && issuer !== (bru.getEnvVar('base_url') ?? '')) {
          for (const name of ['access_token', 'refresh_token', 'token_base_url']) bru.deleteVar(name);
        }
    - type: after-response
      code: |-
        // Capture tokens from REST and GraphQL login/refresh as runtime variables, which live
        // for the session only and are never written to environments/*.yml.
        const url = req.getUrl();
        const status = res.getStatus();
        const body = res.getBody();

        if (/\/auth\/logout\b/.test(url) && status < 300) {
          for (const name of ['access_token', 'refresh_token', 'token_base_url']) bru.deleteVar(name);
        }

        let tokens;
        if (/\/auth\/(login|refresh)\b/.test(url)) tokens = body?.data;
        else if (/\/graphql\/system\b/.test(url)) tokens = body?.data?.auth_login ?? body?.data?.auth_refresh;

        if (status === 200 && tokens?.access_token) {
          bru.setVar('access_token', tokens.access_token);
          if (tokens.refresh_token) bru.setVar('refresh_token', tokens.refresh_token);
          bru.setVar('token_base_url', bru.getEnvVar('base_url') ?? '');
        }

extensions:
  bruno:
    ignore:
      - .git
      - .github
      - .gitignore
      - .DS_Store
      - package.json
      - .oxfmtrc.json
      - node_modules
      - pnpm-lock.yaml
