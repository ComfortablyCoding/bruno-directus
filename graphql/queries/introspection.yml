info:
  name: introspection
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  auth: inherit
  body:
    query: |-
      query IntrospectionQuery {
        __schema {
          types {
            name
            kind
            fields {
              name
              type {
                name
                kind
              }
            }
          }
        }
      }

settings:
  encodeUrl: true

docs: |-
  Introspect the user-data GraphQL schema to discover the types and fields generated
  from your own collections. Use `introspection_system` for system collections.
  https://directus.com/docs/api/graphql
