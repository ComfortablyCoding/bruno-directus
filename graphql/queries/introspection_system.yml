info:
  name: introspection_system
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{base_url}}/graphql/system"
  auth: inherit
  body:
    query: |-
      query IntrospectionQuery {
        __schema {
          types {
            name
            kind
            fields {
              name
              type {
                name
                kind
              }
            }
          }
        }
      }

settings:
  encodeUrl: true

docs: |-
  Introspect the system GraphQL schema to discover the types and fields for system
  collections (users, roles, files, …). Use `introspection` for your own collections.
  https://directus.com/docs/api/graphql
