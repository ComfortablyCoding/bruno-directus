info:
  name: resolve_redirect
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/utils/resolve-redirect"
  body:
    type: json
    data: |-
      {
        "redirect": "/admin/content"
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Validate and resolve a post-login redirect URL. `redirect` is required. Relative paths are
  always allowed; an absolute URL must match `PUBLIC_URL`, or the optional `provider`'s
  `AUTH_<PROVIDER>_REDIRECT_ALLOW_LIST`.
  https://directus.com/docs/api/utilities
