info:
  name: import_data_bulk
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/utils/import"
  params:
    - name: mode
      value: merge
      type: query
      disabled: true
    - name: dryRun
      value: "true"
      type: query
      disabled: true
    - name: dangerouslyAllowDelete
      value: "true"
      type: query
      disabled: true
  body:
    type: json
    data: |-
      [
        {
          "collection": "articles",
          "items": [
            {"title": "Item 1", "status": "draft"},
            {"title": "Item 2", "status": "published"}
          ]
        }
      ]
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Import items into one or more collections in a single transaction. The body is an array of
  `{ "collection": ..., "items": [...] }` objects, one per collection, so the target collection
  is named in the payload rather than in the URL. Use `import_data` to upload a JSON or CSV
  file into a single collection instead.

  Query flags: `mode` is `add` (default, insert only) or `merge` (upsert by primary key);
  `dryRun` runs the import in a transaction that is rolled back, reporting what would change;
  `dangerouslyAllowDelete` (merge mode only) mirrors the payload by deleting every existing
  record in each listed collection that isn't in the import.
  https://directus.com/docs/api/utilities
