    # operations

    CRUD operations for Directus Flow Operations. Supports individual and bulk operations.

    ## Operations

    - Query all operations
    - Query a single operation by ID
    - Create a single operation
    - Create multiple operations (bulk)
    - Update a single operation
    - Update multiple operations (bulk)
    - Delete a single operation
    - Delete multiple operations (bulk)

    ## Docs

    https://directus.com/docs/api/operations
  type: text/markdown
