info:
  name: query_notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/notifications"
  params:
    - name: fields
      value: "id,subject,status,recipient,timestamp"
      type: query
      disabled: true
    - name: filter
      value: '{"status":{"_eq":"inbox"}}'
      type: query
      disabled: true
    - name: sort
      value: "-timestamp"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: search
      value: "keyword"
      type: query
      disabled: true
    - name: meta
      value: "total_count,filter_count"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Retrieve a list of all notifications for the current user.
  https://directus.com/docs/api/notifications
