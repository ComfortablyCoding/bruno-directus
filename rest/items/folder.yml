  content: |-
    # items

    CRUD operations for Directus collection items. Supports individual and bulk operations as well as singleton collections.

    ## Operations

    - Query all items in a collection
    - Query a single item by ID
    - Create a single item
    - Create multiple items (bulk)
    - Update a single item
    - Update multiple items (bulk)
    - Delete a single item
    - Delete multiple items (bulk)
    - Get singleton item
    - Update singleton item
    - Search items with the query in the body (`SEARCH` method)

    `query_items` carries every global query parameter, disabled — `fields`, `filter`, `sort`, `limit`, `offset`, `search`, `meta`, `deep`, `aggregate`, `groupBy`, `alias`, `page`, `backlink`, and `export`. The examples assume the `articles` collection created by **collections → create_collection**.

    ## Docs

    https://directus.com/docs/api/items
  type: text/markdown
