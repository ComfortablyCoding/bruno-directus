info:
  name: promote_version
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/versions/:id/promote"
  params:
    - name: id
      value: "version-id"
      type: path
  body:
    type: json
    data: |-
      {
        "mainHash": "{{main_hash}}"
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Promote a content version by applying its changes to the main item.

  `mainHash` is required — it proves you are promoting against the version of the main item
  you last compared. Run `compare_version` first: it stores `mainHash` in the `main_hash`
  runtime variable used here. A stale hash is rejected with a version-mismatch error.

  Optionally add a `fields` array to promote only selected fields.
  https://directus.com/docs/api/versions
