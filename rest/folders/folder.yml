docs:
  content: |-
    # folders

    Manage file folders in Directus for organizing uploaded files into a hierarchy.

    ## Operations

    - Query all folders
    - Query a single folder by ID
    - Create a folder
    - Create multiple folders (bulk)
    - Update a folder
    - Update multiple folders (bulk)
    - Delete a folder
    - Delete multiple folders (bulk)

    ## Docs

    https://directus.com/docs/api/folders
