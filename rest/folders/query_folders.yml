info:
  name: query_folders
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/folders"
  params:
    - name: fields
      value: "id,name,parent"
      type: query
      disabled: true
    - name: filter
      value: '{"parent":{"_null":true}}'
      type: query
      disabled: true
    - name: sort
      value: "name"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: search
      value: "keyword"
      type: query
      disabled: true
    - name: meta
      value: "total_count,filter_count"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Retrieve a list of folders with optional filtering, sorting, and pagination.
  https://directus.com/docs/api/folders
