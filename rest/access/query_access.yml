info:
  name: query_access
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/access"
  params:
    - name: fields
      value: "id,role,user,policy,sort"
      type: query
      disabled: true
    - name: filter
      value: '{"role":{"_eq":"role-id"}}'
      type: query
      disabled: true
    - name: sort
      value: "sort"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: search
      value: "keyword"
      type: query
      disabled: true
    - name: meta
      value: "total_count,filter_count"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Retrieve the access records that link policies to roles and users.
  https://directus.com/docs/api/access
