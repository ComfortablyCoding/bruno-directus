info:
  name: create_flow
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/flows"
  body:
    type: json
    data: |-
      {
        "name": "My Flow",
        "icon": "bolt",
        "status": "active",
        "trigger": "manual",
        "options": {
          "collections": ["articles"],
          "requireSelection": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Create a manual flow that can be run on `articles` items (see `trigger_manual_flow`).
  https://directus.com/docs/api/flows
