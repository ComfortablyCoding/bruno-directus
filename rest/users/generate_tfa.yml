info:
  name: generate_tfa
  type: http
  seq: 13

http:
  method: POST
  url: "{{base_url}}/users/me/tfa/generate"
  body:
    type: json
    data: |-
      {
        "password": "current-password"
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Generate a two-factor authentication secret and `otpauth` URL for the current
  user. Scan the returned URL/QR with an authenticator app, then call enable_tfa
  with a generated OTP to activate it.
  https://directus.com/docs/api/users
