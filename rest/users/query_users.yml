info:
  name: query_users
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/users"
  params:
    - name: fields
      value: "id,email,first_name,last_name,status,last_access"
      type: query
      disabled: true
    - name: filter
      value: '{"status":{"_eq":"active"}}'
      type: query
      disabled: true
    - name: sort
      value: "-last_access"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: search
      value: "keyword"
      type: query
      disabled: true
    - name: meta
      value: "total_count,filter_count"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Retrieve a list of users with optional filtering, sorting, and pagination.
  https://directus.com/docs/api/users
