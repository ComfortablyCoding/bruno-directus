info:
  name: create_collection
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/collections"
  body:
    type: json
    data: |-
      {
        "collection": "articles",
        "schema": {},
        "meta": {"icon": "article", "versioning": true},
        "fields": [
          {
            "field": "id",
            "type": "integer",
            "meta": {"hidden": true, "interface": "input", "readonly": true},
            "schema": {"is_primary_key": true, "has_auto_increment": true}
          },
          {
            "field": "status",
            "type": "string",
            "meta": {"interface": "select-dropdown", "options": {"choices": [{"text": "Draft", "value": "draft"}, {"text": "Published", "value": "published"}]}},
            "schema": {"default_value": "draft"}
          },
          {
            "field": "title",
            "type": "string",
            "meta": {"interface": "input"},
            "schema": {}
          },
          {
            "field": "body",
            "type": "text",
            "meta": {"interface": "input-rich-text-md"},
            "schema": {}
          },
          {
            "field": "author",
            "type": "uuid",
            "meta": {"interface": "select-dropdown-m2o", "special": ["m2o"]},
            "schema": {}
          },
          {
            "field": "date_created",
            "type": "timestamp",
            "meta": {"special": ["date-created"], "interface": "datetime", "readonly": true},
            "schema": {}
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Create a collection with its fields in one request. This creates the `articles` collection
  (with `id`, `status`, `title`, `body`, `author`, and `date_created`, and content
  versioning enabled) that the items, fields, and GraphQL examples use.
  https://directus.com/docs/api/collections
