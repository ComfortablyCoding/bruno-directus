  content: |-
    # collections

    Manage Directus collections (database tables). Used to create, configure, and delete data model collections.

    ## Operations

    - Query all collections
    - Get a single collection by name
    - Create a collection
    - Update a collection's metadata
    - Update multiple collections (bulk)
    - Delete a collection

    ## Docs

    https://directus.com/docs/api/collections
  type: text/markdown
