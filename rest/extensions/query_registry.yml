info:
  name: query_registry
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/extensions/registry"
  params:
    - name: search
      value: "seo"
      type: query
      disabled: true
    - name: filter
      value: '{"type":{"_eq":"interface"}}'
      type: query
      disabled: true
    - name: sort
      value: "popular"
      type: query
      disabled: true
    - name: limit
      value: "20"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Search the extensions marketplace registry. Admin only. Supports `search`,
  `limit`, `offset`, `sort` (`popular` | `recent` | `downloads`), and `filter`
  (`by` and `type` via `_eq`, where `type` is a valid extension type).
  https://directus.com/docs/api/extensions
