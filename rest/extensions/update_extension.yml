info:
  name: update_extension
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/extensions/:id"
  params:
    - name: id
      value: "extension-uuid"
      type: path
  body:
    type: json
    data: |-
      {
        "meta": {
          "enabled": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Enable or disable an extension by its ID (UUID). Requires a `meta` object in the
  body. Sub-extensions of a bundle cannot be toggled individually.
  https://directus.io/docs/api/extensions
