info:
  name: logout_user
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/logout"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}",
        "mode": "json"
      }

settings:
  encodeUrl: true

docs: |-
  Invalidate a refresh token to log the user out, and clear the captured tokens from the
  session. Sends no access token, so it works after the access token has expired.
  https://directus.com/docs/api/authentication
