info:
  name: login_user
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "password"
      }

settings:
  encodeUrl: true

docs: |-
  Authenticate with email and password against the default local provider. Add `"otp"` if the
  user has two-factor auth enabled.

  On success the collection stores `access_token` and `refresh_token` as runtime variables,
  so every other request is authenticated for you. Runtime variables last for the session
  only and are never written to the environment files.
  https://directus.com/docs/api/authentication
