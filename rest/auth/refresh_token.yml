info:
  name: refresh_token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}",
        "mode": "json"
      }

settings:
  encodeUrl: true

docs: |-
  Exchange a refresh token for a new access token. Uses the `refresh_token` captured at login
  and stores the rotated pair on success. In `cookie`/`session` mode the token is read from
  the cookie instead.
  https://directus.com/docs/api/authentication
