info:
  name: request_password_reset
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/auth/password/request"
  body:
    type: json
    data: |-
      {
        "email": "user@example.com"
      }

settings:
  encodeUrl: true

docs: |-
  Send a password reset email to the specified address. An optional `reset_url` overrides the
  link in the email; it must be allowed by `PASSWORD_RESET_URL_ALLOW_LIST`.
  https://directus.com/docs/api/authentication
