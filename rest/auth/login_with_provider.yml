info:
  name: login_with_provider
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/auth/login/:provider"
  params:
    - name: provider
      value: ldap
      type: path
  body:
    type: json
    data: |-
      {
        "identifier": "jdoe",
        "password": "password"
      }

settings:
  encodeUrl: true

docs: |-
  Authenticate against a configured non-redirect provider by its name in `AUTH_PROVIDERS`.
  LDAP providers take `identifier` (the LDAP username); `local`-driver providers take
  `email` instead. The default local login is `login_user` (`/auth/login`), not
  `/auth/login/local`. Tokens are stored on success, as with `login_user`.
  https://directus.com/docs/api/authentication
