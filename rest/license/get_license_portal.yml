info:
  name: get_license_portal
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/license/portal"
  auth: inherit

settings:
  encodeUrl: true
  followRedirects: false

docs: |-
  Redirect to the billing portal for the active license. Redirects are not followed, so the
  portal URL is in the response's `Location` header. Admin only, and needs a key-based license.
  https://directus.com/docs/licensing/overview
