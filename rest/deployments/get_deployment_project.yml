info:
  name: get_deployment_project
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/deployments/:provider/projects/:id"
  params:
    - name: provider
      value: vercel
      type: path
    - name: id
      value: "project-id"
      type: path
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Get live provider details for a selected project. `id` is the Directus project ID from
  `get_deployment_projects`, not the provider's `external_id`.
  https://directus.com/docs/api/deployments
