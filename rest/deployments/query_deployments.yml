info:
  name: query_deployments
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/deployments"
  params:
    - name: fields
      value: "id,provider,options,last_synced_at,date_created"
      type: query
      disabled: true
    - name: filter
      value: '{"provider":{"_eq":"vercel"}}'
      type: query
      disabled: true
    - name: sort
      value: "-date_created"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: search
      value: "vercel"
      type: query
      disabled: true
    - name: meta
      value: "total_count,filter_count"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  List deployment provider configs (at most one per provider). `credentials` is always returned masked.
  https://directus.com/docs/api/deployments
