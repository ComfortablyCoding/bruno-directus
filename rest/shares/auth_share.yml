info:
  name: auth_share
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/shares/auth"
  body:
    type: json
    data: |-
      {
        "share": "share-id",
        "password": "optional-password"
      }

settings:
  encodeUrl: true

docs: |-
  Authenticate against a share (with its password, if it has one) to get an access token scoped
  to the shared item. Public — sends no user token. The share token is not captured; use it
  by setting a request's auth to `bearer`.
  https://directus.com/docs/api/shares
