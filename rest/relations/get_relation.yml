info:
  name: get_relation
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/relations/:collection/:field"
  params:
    - name: collection
      value: articles
      type: path
    - name: field
      value: author
      type: path
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Retrieve the relation defined on a field, identified by its collection and field name.
  https://directus.com/docs/api/relations
