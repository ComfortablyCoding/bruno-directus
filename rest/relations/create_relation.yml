info:
  name: create_relation
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/relations"
  body:
    type: json
    data: |-
      {
        "collection": "articles",
        "field": "author",
        "related_collection": "directus_users",
        "schema": {
          "on_delete": "SET NULL"
        }
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Create a relation on an existing field. `collection` and `field` identify the foreign key
  field; `related_collection` is the collection it points to (omit it for a many-to-any
  relation). Admin only. The example links the `author` field that `create_collection` adds.
  https://directus.com/docs/api/relations
