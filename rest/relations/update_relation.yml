info:
  name: update_relation
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/relations/:collection/:field"
  params:
    - name: collection
      value: articles
      type: path
    - name: field
      value: author
      type: path
  body:
    type: json
    data: |-
      {
        "schema": {
          "on_delete": "CASCADE"
        },
        "meta": {
          "one_deselect_action": "delete"
        }
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Update the database constraint (`schema`) or Directus metadata (`meta`) of the relation on
  a field. Admin only.
  https://directus.com/docs/api/relations
